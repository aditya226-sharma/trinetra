name: Deploy

# Publishes the self-contained TriNetra container (API + dashboard) to the
# GitHub Container Registry. `docker run ghcr.io/aditya226-sharma/trinetra`
# gives you the full product — pipeline, REST API and UI on one port.
#
# Tags published:
#   - main branch  -> ghcr.io/aditya226-sharma/trinetra:latest (+ :main + :sha-*)
#   - vX.Y.Z tags  -> :X.Y.Z (+ :latest)
#   - manual run   -> :main (branch), :<sha>

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "frontend/src/lib/demo-snapshot.json"
      - "frontend/public/live.html"
      - "frontend/public/live-url.txt"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-image:
    name: Build & publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max